<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>

    <header class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="images/logo_small.png" alt="Camera logo" class="camera-logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#portfolio">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="portfolio-section" id="portfolio">
        <div class="container">
            <h1 class="portfolio-title">Portfolio</h1>
            <div class="portfolio-grid mb-4">
                <div class="portfolio-item">
                    <img src="images/blue-flower-5158746_1280.jpg" alt="Blue flower with water droplets" class="img-fluid">
                </div>
                <div class="portfolio-item">
                    <img src="images/mountains.jpg" alt="Lake and mountains" class="img-fluid">
                </div>
                <div class="portfolio-item portfolio-item--span-4">
                    <img src="images/clouds-3353159_1280.jpg" alt="Dramatic sky with sun rays" class="img-fluid">
                </div>
                <div class="portfolio-item">
                    <img src="images/architecture-1868667_1280.jpg" alt="City skyline at night" class="img-fluid">
                </div>
                <div class="portfolio-item">
                    <img src="images/lake-8763490_1280.jpg" alt="Sailboats on water" class="img-fluid">
                </div>
                <div class="portfolio-item">
                    <img src="images/plum-2679782_1280.jpg" alt="Blue plums" class="img-fluid">
                </div>
                <div class="portfolio-item">
                    <img src="images/snow-7658399_1280.jpg" alt="Textured surface" class="img-fluid">
                </div>
                <div class="portfolio-item">
                    <img src="images/blue-eryngo-7319904_1280.jpg" alt="Thistle flowers" class="img-fluid">
                </div>
                <div class="portfolio-item">
                    <img src="images/art-2578353_1280.jpg" alt="Art supplies flat lay" class="img-fluid">
                </div>
            </div>
            <div class="text-center">
                <a href="#" class="btn btn-primary btn-see-more">See More</a>
            </div>
        </div>
    </main>

    <section class="about-section" id="about">
        <div class="container">
            <h2 class="about-title">About the Artist</h2>
            <p class="about-description">Capturing moments through the lens, my passion is bringing emotions to life in every frame.</p>
            <a href="#" class="btn btn-outline-secondary btn-read-more">Read More</a>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
