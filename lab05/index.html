<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <svg class="camera-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                    <line x1="12" y1="9" x2="12" y2="9.01"/>
                </svg>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#portfolio">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Portfolio Section -->
    <main class="portfolio-section" id="portfolio">
        <div class="container">
            <h1 class="portfolio-title">Portfolio</h1>
            <div class="row g-3 portfolio-grid mb-4">
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1490750967868-88aa44861720?w=600&h=600&fit=crop" alt="Blue flower with water droplets" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=600&fit=crop" alt="Lake with mountains" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600&h=600&fit=crop" alt="Dramatic sky with sun rays" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600&h=600&fit=crop" alt="City skyline at night" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=600&h=600&fit=crop" alt="Sailboats on water" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&h=600&fit=crop" alt="Textured surface" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1498557850523-fd3d118b962e?w=600&h=600&fit=crop" alt="Blue berries" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?w=600&h=600&fit=crop" alt="Thistle flowers" class="img-fluid">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="portfolio-item">
                        <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=600&h=600&fit=crop" alt="Art supplies flat lay" class="img-fluid">
                    </div>
                </div>
            </div>
            <div class="text-center">
                <a href="#" class="btn btn-primary btn-see-more">See More</a>
            </div>
        </div>
    </main>

    <!-- About the Artist -->
    <section class="about-section" id="about">
        <div class="container">
            <h2 class="about-title">About the Artist</h2>
            <p class="about-description">Capturing moments through the lens, my passion is bringing emotions to life in every frame.</p>
            <a href="#" class="btn btn-outline-secondary btn-read-more">Read More</a>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
